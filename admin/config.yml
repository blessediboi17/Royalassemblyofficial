backend:
  name: git-gateway
  branch: main

media_folder: "images" # Where uploaded photos will go
public_folder: "/images"

collections:
  - name: "events"
    label: "Church Events"
    folder: "content/events"
    create: true
    fields:
      - {label: "Event Title", name: "title", widget: "string"}
      - {label: "Date & Time", name: "date", widget: "string"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Description", name: "body", widget: "markdown"}
